# ResFlow 推理配置 — Residual Flow Matching 逆流积分 (不含 Flux)

# VAE 模型名称 (用于编解码)
model_name: flux-dev

# ResFlow 权重路径
resflow_path: checkpoints/resflow.safetensors

# DiT 架构配置 (与训练一致)
model_config: configs/resflow.yaml

# Residual FM 噪声标准差
flow_sigma: 1.0

# 逆流积分步数 (t: 1.0 → 0.0)
infer_steps: 15

# 放大倍数 (输出尺寸 = 原图 × scale)
scale: 4.0

# 随机种子
seed: 42

# 输出目录
out_dir: outputs

# 设备
denoise_device: cuda

# 颜色校正
# 可选: 'adain' | 'wavelet' | 'ycbcr' | 'none'
color_correction: 'wavelet'

# 分块推理 (Latent tiling)
chopping:
  enabled: true
  tile_size: 512       # 像素空间 tile 大小
  tile_stride: 256     # 像素空间 stride
