# RFMSR — LightningDiT architecture hyperparameters (SD2.1 VAE latent space)
# Input: cat(z_lr[4ch], x_t[4ch]) → [B, 8, H, W]
# Output: v [4ch] (velocity prediction)

dit_arch:
  input_size: 64              # latent H (512/8=64)
  patch_size: 2               # patchify size
  in_channels: 8              # z_lr(4) + x_t(4)
  out_channels: 4             # velocity output (SD2.1 latent)
  hidden_size: 1024
  depth: 28                   # DiT block depth
  num_heads: 16                # number of attention heads
  mlp_ratio: 4.0              # FFN expansion ratio
  use_qknorm: true            # Q/K RMSNorm
  use_swiglu: true            # SwiGLU activation
  use_rope: true              # RoPE positional encoding
  use_rmsnorm: true           # RMSNorm (not LayerNorm)
  wo_shift: false             # whether AdaLN includes shift
  use_checkpoint: true       # gradient checkpointing (saves VRAM)

# DINOv2 semantic condition injection (Cross-Attention)
dinov2:
  enc_type: dinov2b           # dinov2b (ViT-B/14) / dinov2l (ViT-L/14) / dinov2g (ViT-G/14)
  enc_dim: 768                # DINOv2 feature dim (dinov2b=768, dinov2l=1024, dinov2g=1536)
  dinov2_size: 448            # Input resize size
  layer_dinov2b_list: [8]     # which DINOv2 layer to inject features from (0-based, ViT-B has 12 layers, ViT-L has 24)
  encdim_ratio: 3             # mlp_ca expansion ratio
