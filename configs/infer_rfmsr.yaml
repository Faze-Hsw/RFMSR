# RFMSR Inference Config — Residual Flow Matching Reverse Integration (SD2.1 VAE)

# SD2.1 VAE path
vae_path: ckpts/stable-diffusion-2-1-base

# RFMSR path
rfmsr_path: ckpts/rfmsr_os.safetensors

# DiT architecture config (consistent with training)
model_config: configs/rfmsr.yaml

# Residual FM noise std
flow_sigma: 1.0

# Reverse integration steps (t: 1.0 → 0.0)
steps: 15

# Upscale factor (output size = input × scale)
scale: 4.0

# Random seed
seed: 42

# Output directory
output: outputs

# Device
denoise_device: cuda

# Color correction
# Options: 'adain' | 'wavelet' | 'ycbcr' | 'none'
color_correction: 'wavelet'

# Tiled inference (Latent tiling)
chopping:
  enabled: true
  tile_size: 512       # Pixel-space tile size
  tile_stride: 256     # Pixel-space stride
