# RFMSR Inference Config — Residual Flow Matching Reverse Integration

# Backbone (architecture + VAE + DINOv2)
backbone: configs/backbones/rfmsr_0.5b.yaml

# RFMSR weights (must match the backbone size)
rfmsr_path: ckpts/RFMSR_0.5B/rfmsr_os.safetensors

# Residual FM noise std
flow_sigma: 1.0

# Reverse integration steps (t: 1.0 → 0.0)
steps: 1

# Upscale factor (output size = input × scale)
scale: 4.0

# Random seed
seed: 42

# Output directory
output: outputs

# Device
denoise_device: cuda

# Color correction
# Options: 'adain' | 'wavelet' | 'ycbcr' | 'none'
color_correction: 'wavelet'

# Tiled inference (Latent tiling)
chopping:
  enabled: true
  tile_size: 512       # Pixel-space tile size
  tile_stride: 256     # Pixel-space stride
