# ResFlow 训练配置 — LightningDiT (VOSR-style, ~0.5B)

# ---- 模型架构（引用外部配置） ----
model_config: configs/resflow.yaml

# ---- 数据 ----
data:
  hr_dir: traindata/
  degradation_config: configs/realesrgan_degradation.yaml
  gt_size: 512
  batch_size: 32
  num_workers: 12
  use_hflip: true
  use_rot: false

# ---- VAE（冻结，仅编解码，训练不需要 Flux DiT / T5 / CLIP） ----
flux:
  model_name: flux-dev
  denoise_device: cuda

# ---- DINOv2（冻结，提取 LR 语义特征注入 DiT Cross-Attention） ----
dinov2:
  enabled: true

# ---- 训练 ----
training:
  iterations: 500000
  lr: 5.0e-5
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 0
  adam_epsilon: 1.0e-8
  gradient_accumulation_steps: 1   
  gradient_clip: 1.0
  use_amp: true
  ema_rate: 0.999
  seed: 42

# ---- Residual Flow Matching ----
flow:
  sigma: 1.0          # 噪声标准差

# ---- 日志 & 保存 ----
experiment:
  name: resflow
  save_dir: experiments/resflow
  log_freq: 1000
  save_freq: 1000
  keep_last_n: 3
