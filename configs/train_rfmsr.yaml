# RFMSR Training Config — LightningDiT

# ---- Model architecture (references external config) ----
model_config: configs/rfmsr.yaml

# ---- Data ----
data:
  hr_dir: traindata/
  degradation_config: configs/realesrgan_degradation.yaml
  gt_size: 512
  batch_size: 32
  num_workers: 8
  use_hflip: true
  use_rot: false

# ---- SD2.1 VAE (frozen encoder/decoder) ----
vae_path: ckpts/stable-diffusion-2-1-base
denoise_device: cuda

# ---- VOSR pretrained weights (optional, for initializing LightningDiT params) ----
pretrained_ckpt: ckpts/VOSR_0.5B_ms/checkpoints/ema_model.safetensors

# ---- DINOv2 (frozen, extracts LR semantic features for DiT Cross-Attention) ----
dinov2:
  enabled: true

# ---- Training ----
training:
  iterations: 10000
  lr: 5.0e-5
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 0.0
  adam_epsilon: 1.0e-8
  gradient_accumulation_steps: 1   
  gradient_clip: 1.0
  use_amp: true
  ema_rate: 0.999
  seed: 42

# ---- Residual Flow Matching ----
flow:
  sigma: 1.0          # noise std
  time_dist: uniform  # time distribution: uniform | lognorm
  # lognorm params (only effective when time_dist=lognorm)
  lognorm_mu: 0.0
  lognorm_sigma: 1.0

# ---- Logging & Saving ----
experiment:
  name: rfmsr
  save_dir: experiments
  log_freq: 1000
  save_freq: 1000
  keep_last_n: 3

# ---- Validation ----
validation:
  enabled: true
  lq_dir: assets/validate_lq
  gt_dir: assets/validate_gt
  scale: 4.0
  steps: 15               # inference steps
  seed: 42
  max_images: 0           # 0 means validate all paired images
