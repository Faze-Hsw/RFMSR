# ResFlow — LightningDiT 架构超参数（SD2.1 VAE 潜空间）
# 输入: cat(z_lr[4ch], x_t[4ch]) → [B, 8, H, W]
# 输出: v [4ch] (速度预测)

dit_arch:
  input_size: 64              # latent H (512/8=64)
  patch_size: 2               # patchify 尺寸
  in_channels: 8              # z_lr(4) + x_t(4)
  out_channels: 4             # velocity output (SD2.1 latent)
  hidden_size: 1024           # 0.5B params
  depth: 28                   # DiT block 层数
  num_heads: 16               # 注意力头数
  mlp_ratio: 4.0              # FFN 扩展比
  use_qknorm: true            # Q/K RMSNorm
  use_swiglu: true            # SwiGLU 激活
  use_rope: true              # RoPE 位置编码
  use_rmsnorm: true           # RMSNorm（非 LayerNorm）
  wo_shift: false             # AdaLN 是否包含 shift
  use_checkpoint: true       # 梯度检查点（省显存）

# DINOv2 语义条件注入（Cross-Attention）
dinov2:
  enc_type: dinov2b           # dinov2b (ViT-B/14) / dinov2l (ViT-L/14) / dinov2g (ViT-G/14)
  enc_dim: 768                # DINOv2 特征维度 (dinov2b=768, dinov2l=1024, dinov2g=1536)
  dinov2_size: 448            # 输入 resize 尺寸
  layer_dinov2b_list: [8]     # 注入哪一层 DINOv2 特征 (0-based, ViT-B共12层, ViT-L共24层)
  encdim_ratio: 3             # mlp_ca 扩展比
