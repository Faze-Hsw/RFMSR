# RFMSR One-Step Training Config — T=1 direct generation, L2 + LPIPS + GAN end-to-end loss

model_config: configs/rfmsr.yaml

data:
  hr_dir: traindata/
  degradation_config: configs/realesrgan_degradation.yaml
  gt_size: 512
  batch_size: 16
  num_workers: 8
  use_hflip: true
  use_rot: false

vae_path: ckpts/stable-diffusion-2-1-base
denoise_device: cuda

# Student initialized from pretrained weights
pretrained_ckpt: ckpts/rfmsr.safetensors

dinov2:
  enabled: true

training:
  iterations: 10000
  lr: 5.0e-5
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_weight_decay: 0.0
  adam_epsilon: 1.0e-8
  gradient_accumulation_steps: 1
  gradient_clip: 1.0
  use_amp: true
  ema_rate: 0.999
  seed: 42

flow:
  sigma: 1.0

# Loss weights
loss:
  velo_weight: 1.0             # velocity supervision (ground-truth, 0 to disable)
  l2_weight: 0.0
  lpips_weight: 1.0
  lpips_net_type: 'vgg'       # 'alex', 'vgg', 'squeeze'
  lpips_chunk_size: 1          # LPIPS chunk size (reduce if OOM; set to batch_size to disable chunking)
  gan_weight: 0.1
  gan_type: 'hinge'            # 'vanilla', 'lsgan', 'wgan', 'wgan-gp', 'hinge'


# Discriminator (latent space 4ch)
discriminator:
  type: 'patch'                # 'patch', 'unet'
  ndf: 64
  n_layers: 3
  norm_type: 'spectral'
  lr: 1.0e-4                   # discriminator learning rate
  update_freq: 2               # update discriminator every N effective steps

experiment:
  name: rfmsr_os
  save_dir: experiments
  log_freq: 1000
  save_freq: 1000
  keep_last_n: 3

validation:
  enabled: true
  lq_dir: assets/validate_lq
  gt_dir: assets/validate_gt
  scale: 4.0
  seed: 42
  max_images: 0
  val_steps: [1, 15]          # run both 1-step and 15-step Euler inference during validation
