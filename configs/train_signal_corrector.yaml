# Signal Corrector Δ_φ 训练配置

# ---- 模型架构（引用外部配置） ----
model_config: configs/signal_corrector.yaml

# ---- 数据 ----
data:
  hr_dir: /path/to/hr_images
  degradation_config: configs/realesrgan_degradation.yaml
  gt_size: 512
  batch_size: 4
  num_workers: 4
  use_hflip: true
  use_rot: false

# ---- Flux（冻结） ----
flux:
  model_name: flux-dev
  prompt: "Cinematic, high-contrast, photo-realistic, 8k, ultra HD, meticulous detailing, hyper sharpness, perfect without deformations"
  guidance: 3.5
  device: cuda

# ---- 训练 ----
training:
  iterations: 100000
  lr: 1.0e-4
  weight_decay: 1.0e-2
  gradient_clip: 1.0
  use_amp: true
  ema_rate: 0.999
  t_min: 0.2
  t_max: 0.8
  seed: 42

# ---- 日志 & 保存 ----
experiment:
  name: signal_corrector_v1
  save_dir: experiments/signal_corrector_v1
  log_freq: 200
  save_freq: 5000
