# Flux 两阶段流超分推理配置
# 参数优先级: CLI 参数 > 此配置文件 > 内置默认值
#
# 两阶段逆流积分:
#   Phase 1 (t ∈ [switch_t, 1.0]): Embedder only — Residual FM，z_lr+noise 起点还原细节
#   Phase 2 (t ∈ [0, switch_t]):   Flux only   — 提升质量

# 模型名称: flux-dev, flux-schnell 等
model_name: flux-dev

# 模型权重路径
weights:
  t5xxl: checkpoints/t5xxl_fp16.safetensors
  clip: checkpoints/clip_l.safetensors

# 质量引导 prompt
prompt: "Cinematic, high-contrast, photo-realistic, 8k, ultra HD, meticulous detailing, hyper sharpness, perfect without deformations"

# 采样参数
cfg: 3.5
seed: 42
scale: 4.0             # 放大倍数，输出尺寸 = 原图 × scale
shift: false           # 时间步 shift（高噪声区分配更多步数）

switch_t: 0.5

# 逆流积分步数 (1.0 → 0.0, 步数越多质量越好但越慢)
infer_steps: 28

# T5 最大序列长度
t5_max_length: 512

# 输出目录
out_dir: outputs

verbose: true

# 设备
text_encoder_device: cuda
denoise_device: cuda

# 分块推理（Latent tiling, VOSR 风格）
# tile_size / tile_overlap 是像素空间参数，自动转换为 latent 空间大小
# tile_size=512 → latent 64×64 tile; overlap 最终由 max(px//8, lt//8) 决定
chopping:
  enabled: true
  tile_size: 512
  tile_overlap: 4

# DiT Flow Embedder (LightningDiT)
flow_embedder_path: checkpoints/flow_embedder.safetensors
no_flow_embedder: false
flow_sigma: 1.0           # Residual FM 噪声标准差 (latent 空间)
