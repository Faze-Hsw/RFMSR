# Flow Embedder 训练配置 — Velocity Correction

# ---- 模型架构（引用外部配置） ----
model_config: configs/flow_embedder.yaml

# ---- 数据 ----
data:
  hr_dir: traindata/
  degradation_config: configs/realesrgan_degradation.yaml
  gt_size: 512
  batch_size: 16
  num_workers: 12
  use_hflip: true
  use_rot: false

# ---- Flux（冻结） ----
flux:
  model_name: flux-dev
  prompt: "Cinematic, high-contrast, photo-realistic, 8k, ultra HD, meticulous detailing, hyper sharpness, perfect without deformations"
  guidance: 3.5
  text_encoder_device: cuda
  denoise_device: cuda
  weights:
    t5xxl: checkpoints/t5xxl_fp16.safetensors
    clip: checkpoints/clip_l.safetensors
  t5_max_length: 512

# ---- 训练 ----
training:
  iterations: 100000
  lr: 5.0e-5
  weight_decay: 0
  gradient_clip: 1.0
  use_amp: true
  ema_rate: 0.99
  seed: 42
  use_gradient_checkpointing: true
  gradient_checkpointing_chunk: 3

# ---- 日志 & 保存 ----
experiment:
  name: flow_embedder
  save_dir: experiments/flow_embedder
  log_freq: 1000
  save_freq: 1000
